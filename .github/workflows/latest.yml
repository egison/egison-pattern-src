on: push

name: latest

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc:
          - '9.10.1'
        cabal:
          - '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
      - run: cabal update
      - run: cabal test all
  hlint:
    name: lint .hs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.8'
      - uses: haskell-actions/hlint-run@v2
        with:
          path: '["egison-pattern-src/", "egison-pattern-src-haskell-mode/", "egison-pattern-src-th-mode/"]'
          fail-on: warning
  ormolu:
    name: check .hs format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/run-ormolu@v16
        with:
          version: '0.7.7.0'
          pattern: |
            egison-pattern-src/**/*.hs
            egison-pattern-src-haskell-mode/**/*.hs
            egison-pattern-src-th-mode/**/*.hs
